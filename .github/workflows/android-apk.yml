name: Android APK

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - android/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:
    inputs:
      version:
        description: Version name (MAJOR.MINOR.PATCH). Empty uses the gradle default.
        required: false
        type: string

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH (example: v0.1.0)."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "MEWO_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "MEWO_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionName=$version versionCode=$code (major*1000000 + minor*1000 + patch)"

      - name: Version from dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version $version is not MAJOR.MINOR.PATCH (example: 0.1.0)."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "MEWO_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "MEWO_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionName=$version versionCode=$code (major*1000000 + minor*1000 + patch)"

      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          MEWO_STORE_BASE64: ${{ secrets.MEWO_STORE_BASE64 }}
          MEWO_STORE_PASSWORD: ${{ secrets.MEWO_STORE_PASSWORD }}
          MEWO_KEY_ALIAS: ${{ secrets.MEWO_KEY_ALIAS }}
          MEWO_KEY_PASSWORD: ${{ secrets.MEWO_KEY_PASSWORD }}
        run: |
          missing=0
          for name in MEWO_STORE_BASE64 MEWO_STORE_PASSWORD MEWO_KEY_ALIAS MEWO_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is missing. Add it as a GitHub Actions secret."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          keystore="$RUNNER_TEMP/mewo-release.jks"
          echo "$MEWO_STORE_BASE64" | base64 -d > "$keystore"
          echo "MEWO_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build release APK
        working-directory: android
        env:
          MEWO_STORE_PASSWORD: ${{ secrets.MEWO_STORE_PASSWORD }}
          MEWO_KEY_ALIAS: ${{ secrets.MEWO_KEY_ALIAS }}
          MEWO_KEY_PASSWORD: ${{ secrets.MEWO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --max-workers=12 --no-daemon

      - name: Check signed APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "Signed APK missing at $apk. assembleRelease did not sign. Check MEWO_STORE_* secrets."
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"

      - name: Upload APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mewo-${{ env.MEWO_VERSION_NAME || 'release' }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="mewo-${MEWO_VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "Mewo ${MEWO_VERSION_NAME}" \
            --generate-notes
