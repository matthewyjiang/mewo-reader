# Toolchains for every part of the repo. `mise install` from the root gets them all.
# System packages mise can't provide (usbmuxd for xtool) are listed in README.md.

[tools]
# android/: matches CI (actions/setup-java temurin 17) and the app's JVM target.
java = "temurin-17"
# web/ and the server image's web stage (node:22-bookworm-slim).
node = "22"
# server/: mirrors server/rust-toolchain.toml, which rustup still honors inside server/.
rust = "1.88.0"
# ios/ on Linux: xtool needs the Swift 6.4 toolchain.
swift = "6.4.0"
# ios/ on Linux: builds the SwiftPM package in ios/ into an .app and installs it.
"github:xtool-org/xtool" = { version = "1.22.2", bin = "xtool", os = ["linux"] }
