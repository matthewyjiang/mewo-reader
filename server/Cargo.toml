[package]
name = "mewo-server"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
axum = { version = "0.8", features = ["multipart"] }
hex = "0.4"
rand = "0.8"
rpassword = "7"
roxmltree = "=0.20.0"
scraper = { version = "=0.23.1", default-features = false }
ego-tree = "=0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace", "fs", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
